<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Nhảy Lò Cò Số</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="loco.title">🐸 Nhảy Lò Cò Số</h1>
      <button class="round-btn" id="btnSay" data-i18n-title="tomau.say" title="Đọc lại">📢</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tabStep1">1 → 10</button>
      <button class="tab" id="tabStep2" data-i18n="loco.step2">Cách 2</button>
      <button class="tab" id="tabStep5" data-i18n="loco.step5">Cách 5</button>
    </div>

    <div class="prompt" id="prompt"></div>

    <main class="stage">
      <div class="court" id="court"></div>
      <div class="frog" id="frog">🐸</div>
      <div class="cheer hidden" id="cheer">
        <div class="cheer-emoji">🏆</div>
        <div class="cheer-text" id="cheerText"></div>
        <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
