<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Ghép Hình Trượt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="ghephinh.title">🧩 Ghép Hình Trượt</h1>
      <div class="moves" id="moves">0</div>
      <button class="round-btn" id="btnPeek" data-i18n-title="ghephinh.peek" title="Xem hình mẫu">👁️</button>
      <button class="round-btn" id="btnNew" data-i18n-title="pika.btn.new" title="Xáo lại">🔄</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tab3" data-i18n="ghephinh.easy">Dễ 3×3</button>
      <button class="tab" id="tab4" data-i18n="ghephinh.hard">Khó 4×4</button>
    </div>

    <!-- Dải chọn ảnh Pokémon -->
    <nav class="picker" id="picker"></nav>

    <main class="stage">
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board"></div>
        <img class="peek hidden" id="peekImg" alt="">
        <div class="cheer hidden" id="cheer">
          <div class="cheer-emoji">🏆</div>
          <img class="cheer-img" id="cheerImg" alt="">
          <div class="cheer-text" id="cheerText"></div>
          <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
