<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Võ Đài Thú Nhí</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/game-mini/" data-i18n-title="hocvui.back" title="Chọn trò khác">◀</a>
      <h1 data-i18n="vodai.title">🥊 Võ Đài Thú Nhí</h1>
      <button class="round-btn" id="btnBack" title="Chọn thú khác" hidden>◀</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <main class="screen" id="homeScreen">
      <div class="pick-title" data-i18n="vodai.pick">Chọn bạn thú bông của bé!</div>
      <div class="pick-row" id="pickRow"></div>
      <div class="type-hint" data-i18n="vodai.hint">Đòn CAO 🥊 thì ĐỠ 🛡 · đòn THẤP 🦵 thì NÉ 💨 · thấy SƠ HỞ ⭐ thì ĐẤM 🥊!</div>
    </main>

    <main class="screen hidden" id="battleScreen">
      <div class="ring" id="ring">
        <div class="fx-layer" id="fxLayer"></div>
        <div class="fighter foe">
          <div class="f-name" id="foeName">?</div>
          <div class="hp-bar"><div class="hp-fill" id="foeHpFill"></div></div>
          <img class="f-img" id="foeImg" src="images/tho.svg" alt="" draggable="false">
        </div>
        <div class="cue-box hidden" id="cueBox">
          <img class="cue-icon" id="cueIcon" src="images/glove.svg" alt="">
          <div class="cue-timer"><div class="cue-fill" id="cueFill"></div></div>
        </div>
        <div class="fighter me">
          <img class="f-img" id="meImg" src="images/gau.svg" alt="" draggable="false">
          <div class="hp-bar"><div class="hp-fill good" id="meHpFill"></div></div>
          <div class="f-name" id="meName">?</div>
        </div>
        <div class="rage-row" id="rageRow"></div>
      </div>

      <div class="battle-log" id="battleLog"></div>
      <div class="action-row">
        <button class="act-btn act-dam" id="btnDam"><img src="images/glove.svg" alt="">ĐẤM</button>
        <button class="act-btn act-do" id="btnDo"><img src="images/shield.svg" alt="">ĐỠ</button>
        <button class="act-btn act-ne" id="btnNe"><img src="images/dash.svg" alt="">NÉ</button>
      </div>
      <div class="round-chip" id="roundChip"></div>
    </main>

    <div class="cheer hidden" id="cheer">
      <div class="cheer-emoji" id="cheerEmoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnCheerGo">CHƠI LẠI ▶</button>
      <a class="big-btn big-btn--ghost" href="/game-mini/" data-i18n="hocvui.pick">CHỌN TRÒ KHÁC</a>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
