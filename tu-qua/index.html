<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fff6e8" />
<title>Tủ Quà & Vườn Hoa</title>
<style>
:root{--bg:#fff6e8;--gold:#ff8a3d;--gold2:#c2410c;--ink:#241e2e;--ink-dim:#5d5370;--line:#a8834a;--panel:#fffaf2;--panel2:#fff3df;--good:#15803d;--bad:#c02a2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse 90% 55% at 50% 0%, #ffe9c8 0%, transparent 70%),var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header .back{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;color:var(--ink)}
h1{margin:0;font-size:20px;color:var(--gold2);flex:1}
.stars{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:900;font-size:16px;color:var(--gold2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(194,65,12,.08)}
.card h2{margin:0 0 10px;font-size:16px;color:var(--gold2)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.item{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.item .icon{font-size:38px;line-height:1.3}
.item .name{font-size:12px;font-weight:800;min-height:2.2em}
.item button{width:100%;background:linear-gradient(180deg,#ff9d5c,#c2410c);color:#fff;border:none;border-radius:9px;
  padding:6px;font-weight:900;font-size:13px;cursor:pointer;margin-top:4px}
.item button:disabled{opacity:.45;cursor:default}
.garden{min-height:70px;background:linear-gradient(180deg,#eaf7e5,#d6efcf);border:2px dashed #7cc39a;border-radius:14px;
  padding:12px;font-size:34px;letter-spacing:6px;line-height:1.5}
.rowline{font-size:15px;margin:6px 0}
.note{font-size:13px;color:var(--ink-dim);line-height:1.7;text-align:center;margin-top:20px}
.note a{color:var(--gold2)}
.msg{min-height:1.3em;font-size:14px;font-weight:800;margin-top:8px}
.msg.ok{color:var(--good)} .msg.bad{color:var(--bad)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/" title="Trang chủ">🏠</a>
    <h1>🎁 Tủ Quà & Vườn Hoa</h1>
    <div class="stars" id="starBox">⭐ …</div>
  </header>

  <div id="viewGuide" class="note hidden"></div>

  <div id="viewMain" class="hidden">
    <div class="card">
      <h2>🌸 Vườn hoa của bé</h2>
      <div class="garden" id="garden"></div>
      <div class="rowline" id="petsRow"></div>
      <div class="rowline" id="candyRow"></div>
      <div class="rowline" id="badgeRow"></div>
    </div>

    <div class="card">
      <h2>🛍️ Đổi sao lấy quà</h2>
      <div class="shop" id="shop"></div>
      <div class="msg" id="shopMsg"></div>
    </div>

    <p class="note">Bé kiếm ⭐ bằng cách chơi các game học (10 điểm = 1 sao) và học chăm mỗi ngày.<br>
    Cứ đủ 15 câu trả lời trong ngày bé còn được tặng kẹo miễn phí nữa đó! 🍬</p>
  </div>
</div>
<script src="/server-config.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
