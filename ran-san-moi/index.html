<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Rắn Săn Mồi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="ran.title">🐍 Rắn Săn Mồi</h1>
      <div class="target" id="target">🍎</div>
      <div class="score" id="score">0</div>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tabClassic" data-i18n="ran.tab.classic">🍎 Cổ điển</button>
      <button class="tab" id="tabAbc">🅰️ A → Z</button>
      <button class="tab" id="tabNum">🔢 1 → 9</button>
    </div>

    <main class="stage">
      <div class="board-wrap" id="boardWrap">
        <canvas id="gameCanvas" width="680" height="600"></canvas>
        <!-- Màn bắt đầu / thua / thắng -->
        <div class="overlay" id="overlay">
          <div class="ov-emoji" id="ovEmoji">🐍</div>
          <div class="ov-text" id="ovText" data-i18n="ran.start">Bấm để chơi!</div>
          <button class="big-btn" id="btnPlay" data-i18n="ran.play">CHƠI ▶</button>
        </div>
      </div>
    </main>

    <!-- D-pad cho màn hình cảm ứng -->
    <div class="dpad">
      <button class="dpad-btn up" data-dir="up">▲</button>
      <button class="dpad-btn left" data-dir="left">◀</button>
      <div class="dpad-mid">🐍</div>
      <button class="dpad-btn down" data-dir="down">▼</button>
      <button class="dpad-btn right" data-dir="right">▶</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
