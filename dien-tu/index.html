<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Điện Tử Xưa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="dientu.title">🕹️ Điện Tử Xưa</h1>
      <button class="round-btn" id="btnBack" data-i18n-title="hocvui.back" title="Chọn trò khác" hidden>◀</button>
      <button class="round-btn" id="btnNew" data-i18n-title="pika.btn.new" title="Chơi lại" hidden>🔄</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="sub-line" id="subLine"></div>

    <main class="screen" id="homeScreen">
      <button class="mode-card" data-game="ducks"><span class="mc-icon">🦆</span><span class="mc-name" data-i18n="dientu.ducks">Bắn vịt trời</span></button>
      <button class="mode-card" data-game="bricks"><span class="mc-icon">🧱</span><span class="mc-name" data-i18n="dientu.bricks">Đập gạch bóng nảy</span></button>
      <button class="mode-card" data-game="racer"><span class="mc-icon">🚕</span><span class="mc-name" data-i18n="dientu.racer">Đua xe né chướng ngại</span></button>
    </main>

    <main class="screen hidden" id="playScreen"></main>

    <div class="cheer hidden" id="cheer">
      <div class="cheer-emoji" id="cheerEmoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
      <button class="big-btn big-btn--ghost" id="btnHome2" data-i18n="hocvui.pick">CHỌN TRÒ KHÁC</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
