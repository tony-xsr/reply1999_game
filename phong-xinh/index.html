<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e8">
  <title>Phòng Xinh Của Bé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/game-mini/" data-i18n-title="hocvui.back" title="Chọn trò khác">◀</a>
      <h1 data-i18n="phongxinh.title">🛏️ Phòng Xinh Của Bé</h1>
      <button class="round-btn" id="btnRandom" title="Trang trí ngẫu nhiên">🎲</button>
      <button class="round-btn" id="btnSave" title="Lưu căn phòng">📷</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="room-toolbar">
      <button class="round-btn room-tab active" data-room="1" title="Phòng 1">1️⃣</button>
      <button class="round-btn room-tab" data-room="2" title="Phòng 2">2️⃣</button>
      <button class="round-btn room-tab" data-room="3" title="Phòng 3">3️⃣</button>
      <button class="round-btn room-tab" data-room="4" title="Phòng 4">4️⃣</button>
      <button class="round-btn room-tab" data-room="5" title="Phòng 5">5️⃣</button>
    </div>

    <div class="say-bubble" id="sayBubble">👋 Hello!</div>

    <main class="stage">
      <div class="room-wrap">
        <div class="room" id="room">
          <div class="room-wall" id="roomWall"></div>
          <div class="room-floor" id="roomFloor"></div>
        </div>
        <div class="sel-tools hidden" id="selTools">
          <button id="btnFlip" title="Lật trái phải">⇄</button>
          <button id="btnRemove" title="Cất món đồ">🗑️</button>
        </div>
      </div>

      <div class="side">
        <div class="palette" id="palette"></div>
        <div class="swatches">
          <div class="style-row" id="styleRow"></div>
          <div class="swatch-row" id="wallRow"></div>
          <div class="swatch-row" id="floorRow"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
