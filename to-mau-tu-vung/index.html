<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Tô Màu Từ Vựng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/thi-chung-chi-anh/" data-i18n-title="examhub.back" title="Thi Chứng Chỉ Anh">🏠</a>
      <h1 data-i18n="tomautv.title">🎨 Tô Màu Từ Vựng</h1>
      <button class="round-btn" id="btnSkip" data-i18n-title="tomautv.skip" title="Đổi từ khác">🔀</button>
      <button class="round-btn" id="btnSay" data-i18n-title="tomau.say" title="Đọc lại">📢</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="word-label" id="wordLabel"></div>

    <main class="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="paintCanvas" width="640" height="640"></canvas>
        <!-- Màn khen thưởng sau khi tô xong -->
        <div class="cheer hidden" id="cheer">
          <div class="cheer-emoji" id="cheerEmoji">🍎</div>
          <div class="cheer-text" id="cheerText"></div>
          <button class="big-btn" id="btnNext" data-i18n="tomau.next">TIẾP ▶</button>
        </div>
      </div>
    </main>

    <!-- Khay màu -->
    <footer class="palette" id="palette"></footer>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
