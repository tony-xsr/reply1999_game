<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#dff3fb">
  <title>Hồ Cá Từ Vựng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/thi-chung-chi-anh/" data-i18n-title="examhub.back" title="Thi Chứng Chỉ Anh">🏠</a>
      <h1 data-i18n="hoca.title">🎣 Hồ Cá Từ Vựng</h1>
      <div class="chip-stat" id="clock">45s</div>
      <div class="chip-stat score" id="score">0</div>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="target-line">
      <span data-i18n="hoca.only">Câu trúng cá mang từ</span>
      <b id="targetTag">🍎 apple</b>
    </div>

    <main class="stage">
      <div class="pond" id="pond"></div>
      <div class="overlay" id="overlay">
        <div class="ov-emoji" id="ovEmoji">🐟</div>
        <div class="ov-text" id="ovText" data-i18n="hoca.help">Cá sẽ bơi ngang qua hồ theo từng làn nước, mỗi con mang 1 từ tiếng Anh. Máy sẽ đọc to từ mục tiêu — bé chỉ câu trúng con cá mang ĐÚNG từ đó! Câu đúng 3 lần liên tiếp thì đổi từ mục tiêu khác.</div>
        <button class="big-btn" id="btnPlay" data-i18n="ran.play">CHƠI ▶</button>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
