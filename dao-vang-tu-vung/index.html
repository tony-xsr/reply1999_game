<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#efe1c4">
  <title>Đào Vàng Từ Vựng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/thi-chung-chi-anh/" data-i18n-title="examhub.back" title="Thi Chứng Chỉ Anh">🏠</a>
      <h1 data-i18n="daovangtv.title">⛏️ Đào Vàng Từ Vựng</h1>
      <div class="chip-stat" id="levelChip">1/6</div>
      <div class="chip-stat score" id="scoreChip">0</div>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="target-line">
      <span data-i18n="daovangtv.dig">Đào lên từ</span>
      <b id="targetTag">🍎 apple</b>
    </div>

    <main class="stage">
      <div class="field" id="field"></div>
      <div class="overlay" id="overlay">
        <div class="ov-emoji" id="ovEmoji">⛏️</div>
        <div class="ov-text" id="ovText" data-i18n="daovangtv.help">Dưới lòng đất là các ô chôn từ vựng — máy đọc to từ mục tiêu, bé đào (chạm) từng ô cho tới khi đào TRÚNG ô mang đúng từ đó! Ô đã đào sẽ lộ ra mãi mãi, đào trúng là qua màn mới nhiều ô hơn.</div>
        <button class="big-btn" id="btnPlay" data-i18n="ran.play">CHƠI ▶</button>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
