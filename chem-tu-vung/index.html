<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff0e8">
  <title>Chém Từ Vựng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/thi-chung-chi-anh/" data-i18n-title="examhub.back" title="Thi Chứng Chỉ Anh">🏠</a>
      <h1 data-i18n="chemtv.title">🗡️ Chém Từ Vựng</h1>
      <div class="chip-stat" id="clockChip">45s</div>
      <div class="chip-stat score" id="scoreChip">0</div>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <main class="stage">
      <div class="arena" id="arena"></div>
      <div class="overlay" id="overlay">
        <div class="ov-emoji" id="ovEmoji">🗡️</div>
        <div class="ov-text" id="ovText" data-i18n="chemtv.help">Icon trái cây/đồ vật sẽ bay lên từ dưới màn hình — chạm thật nhanh vào icon nào bé thích, máy sẽ đọc to tên tiếng Anh của nó! Không có đáp án sai, cứ chém thoải mái để nghe thật nhiều từ mới trong 45 giây nhé.</div>
        <button class="big-btn" id="btnPlay" data-i18n="ran.play">CHƠI ▶</button>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
