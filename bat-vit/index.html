<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Bắt Vịt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="batvit.title">🐤 Bắt Vịt</h1>
      <div class="chip-stat" id="clock">45s</div>
      <div class="chip-stat score" id="score">0</div>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tabClassic" data-i18n="batvit.tab.classic">🐤 Đập hết</button>
      <button class="tab" id="tabLetter" data-i18n="batvit.tab.letter">🅰️ Đập theo chữ</button>
    </div>

    <div class="target-line hidden" id="targetLine">
      <span data-i18n="batvit.only">Chỉ đập con mang chữ</span> <b id="targetCh">B</b>
    </div>

    <main class="stage">
      <div class="pond" id="pond"></div>
      <div class="overlay" id="overlay">
        <div class="ov-emoji" id="ovEmoji">🐤</div>
        <div class="ov-text" id="ovText" data-i18n="ran.start">Bấm để chơi!</div>
        <button class="big-btn" id="btnPlay" data-i18n="ran.play">CHƠI ▶</button>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
