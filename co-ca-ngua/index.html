<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Cờ Cá Ngựa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="cangua.title">🐴 Cờ Cá Ngựa</h1>
      <button class="round-btn" id="btnNew" data-i18n-title="pika.btn.new" title="Ván mới">🔄</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tab2">🔴 <span data-i18n="cangua.vs1">vs 1 máy</span></button>
      <button class="tab" id="tab4">🔴 <span data-i18n="cangua.vs3">vs 3 máy</span></button>
      <button class="tab" id="tab2p" data-i18n="caro.vs2p">👥 2 người</button>
    </div>

    <main class="stage">
      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="cheer hidden" id="cheer">
          <div class="cheer-emoji" id="cheerEmoji">🏆</div>
          <div class="cheer-text" id="cheerText"></div>
          <button class="big-btn" id="btnAgain" data-i18n="caro.next">VÁN MỚI ▶</button>
        </div>
      </div>
    </main>

    <div class="die-row">
      <span class="turn-chip" id="turnChip"></span>
      <button class="die-btn" id="btnDie">🎲</button>
      <span class="note" id="note"></span>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
