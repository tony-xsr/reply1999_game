<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Pokémon Đại Chiến</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/game-mini/" data-i18n-title="hocvui.back" title="Chọn trò khác">◀</a>
      <h1 data-i18n="pokedc.title">⚡ Pokémon Đại Chiến</h1>
      <button class="round-btn" id="btnBack" title="Chọn Pokémon khác" hidden>◀</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <main class="screen" id="homeScreen">
      <div class="pick-title" data-i18n="pokedc.pick">Chọn Pokémon khởi đầu của bé!</div>
      <div class="filter-row" id="filterRow"></div>
      <div class="pick-row" id="pickRow"></div>
      <div class="type-hint" data-i18n="pokedc.hint">🔥 Lửa khắc 🌿 Cỏ · 🌿 Cỏ khắc 💧 Nước · 💧 Nước khắc 🔥 Lửa · ⚡ Điện khắc 💧 Nước</div>
      <div class="type-hint" data-i18n="pokedc.evolvehint">Thắng trận để Pokémon TIẾN HÓA mạnh hơn — trùm đang chờ ở trận cuối!</div>
    </main>

    <main class="screen hidden" id="battleScreen">
      <div class="arena" id="arena">
        <div class="fx-layer" id="fxLayer"></div>
        <div class="boss-banner hidden" id="bossBanner" data-i18n="pokedc.boss">👑 TRÙM XUẤT HIỆN!</div>

        <div class="info-box enemy-box">
          <div class="ib-row"><span class="ib-name" id="enemyName">?</span><span class="type-badge" id="enemyType"></span></div>
          <div class="hp-bar"><div class="hp-fill" id="enemyHpFill"></div></div>
          <div class="ib-hp" id="enemyHpText"></div>
        </div>
        <div class="platform enemy-plat">
          <img class="sprite enemy-sprite" id="enemySprite" alt="" draggable="false">
        </div>

        <div class="platform player-plat">
          <img class="sprite player-sprite" id="playerSprite" alt="" draggable="false">
        </div>
        <div class="info-box player-box">
          <div class="ib-row"><span class="ib-name" id="playerName">?</span><span class="type-badge" id="playerType"></span></div>
          <div class="hp-bar"><div class="hp-fill good" id="playerHpFill"></div></div>
          <div class="ib-hp" id="playerHpText"></div>
        </div>

        <div class="evolve-flash hidden" id="evolveFlash"></div>
      </div>

      <div class="battle-log" id="battleLog"></div>
      <div class="move-row" id="moveRow"></div>
      <div class="round-chip" id="roundChip"></div>
    </main>

    <div class="cheer hidden" id="cheer">
      <img class="cheer-sprite hidden" id="cheerSprite" alt="">
      <div class="cheer-emoji" id="cheerEmoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnCheerGo">CHƠI LẠI ▶</button>
      <a class="big-btn big-btn--ghost" href="/game-mini/" data-i18n="hocvui.pick">CHỌN TRÒ KHÁC</a>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
