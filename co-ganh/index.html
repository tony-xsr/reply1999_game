<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Cờ Gánh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="coganh.title">⚫ Cờ Gánh</h1>
      <button class="round-btn" id="btnNew" data-i18n-title="pika.btn.new" title="Ván mới">🔄</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tabAi" data-i18n="caro.vsai">🤖 Với máy</button>
      <button class="tab" id="tab2p" data-i18n="caro.vs2p">👥 2 người</button>
    </div>

    <div class="hud">
      <span class="side b" id="countB">🔵 8</span>
      <span class="turn" id="turnLabel"></span>
      <span class="side r" id="countR">🔴 8</span>
    </div>

    <main class="stage">
      <div class="board-wrap">
        <svg id="boardSvg" viewBox="0 0 500 500"></svg>
        <div class="cheer hidden" id="cheer">
          <div class="cheer-emoji" id="cheerEmoji">🏆</div>
          <div class="cheer-text" id="cheerText"></div>
          <button class="big-btn" id="btnAgain" data-i18n="caro.next">VÁN MỚI ▶</button>
        </div>
      </div>
    </main>
    <p class="hint" data-i18n="coganh.hint">Đứng giữa 2 quân địch thẳng hàng là "gánh" — cả 2 đổi màu theo mình!</p>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
