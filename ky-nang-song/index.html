<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e8">
  <title>Kỹ Năng Sống &amp; Cảm Xúc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="kynang.title">💛 Kỹ Năng Sống</h1>
      <button class="round-btn" id="btnSay" data-i18n-title="tomau.say" title="Đọc lại">📢</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tabCamXuc" data-i18n="kynang.tab.camxuc">😊 Cảm xúc</button>
      <button class="tab" id="tabTuLap" data-i18n="kynang.tab.tulap">🪥 Tự lập</button>
      <button class="tab" id="tabAnToan" data-i18n="kynang.tab.antoan">🚦 An toàn</button>
    </div>

    <div class="dots" id="dots"></div>

    <main class="stage">
      <div class="question" id="question"></div>
      <div class="field" id="field"></div>
      <div class="tray" id="tray"></div>

      <div class="cheer hidden" id="cheer">
        <div class="cheer-emoji">🏆</div>
        <div class="cheer-text" id="cheerText"></div>
        <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
