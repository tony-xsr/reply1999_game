<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#efe6d8">
  <title>Trường Bắn Từ Vựng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/thi-chung-chi-anh/" data-i18n-title="examhub.back" title="Thi Chứng Chỉ Anh">🏠</a>
      <h1 data-i18n="truongban.title">🎯 Trường Bắn Từ Vựng</h1>
      <div class="chip-stat" id="levelChip">1/6</div>
      <div class="chip-stat score" id="scoreChip">0</div>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="target-line">
      <span data-i18n="truongban.call">Bắn trúng mục tiêu mang từ</span>
      <b id="targetTag">🍎 apple</b>
    </div>

    <main class="stage">
      <div class="range" id="range"></div>
      <div class="overlay" id="overlay">
        <div class="ov-emoji" id="ovEmoji">🎯</div>
        <div class="ov-text" id="ovText" data-i18n="truongban.help">Cả hàng mục tiêu đứng yên, mỗi cái mang 1 từ tiếng Anh. Máy sẽ xướng tên từng từ — bé phải bắn TRÚNG mục tiêu đang được gọi tên, bắn nhầm không tính! Hạ hết cả hàng là qua màn mới nhiều mục tiêu hơn.</div>
        <button class="big-btn" id="btnPlay" data-i18n="ran.play">CHƠI ▶</button>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
