<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e8">
  <title>Kim Cương Lấp Lánh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/game-mini/" data-i18n-title="hocvui.back" title="Chọn trò khác">◀</a>
      <h1 data-i18n="kimcuong.title">💎 Kim Cương Lấp Lánh</h1>
      <button class="round-btn" id="btnNew" data-i18n-title="pika.btn.new" title="Chơi lại">🔄</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="hud">
      <div class="hud-chip money"><span>💎</span><b id="hudPairs">0/0</b></div>
      <div class="hud-chip level" id="hudLevel">Màn 1</div>
    </div>

    <main class="stage">
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board"></div>
        <svg id="lines" preserveAspectRatio="none"></svg>
      </div>
    </main>

    <div class="cheer hidden" id="cheer">
      <div class="cheer-emoji" id="cheerEmoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnCheerGo">MÀN TIẾP ▶</button>
      <a class="big-btn big-btn--ghost" href="/game-mini/" data-i18n="hocvui.pick">CHỌN TRÒ KHÁC</a>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
