<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e8">
  <title>Đào Vàng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/game-mini/" data-i18n-title="hocvui.back" title="Chọn trò khác">◀</a>
      <h1 data-i18n="daovang.title">⛏️ Đào Vàng</h1>
      <button class="round-btn" id="btnNew" data-i18n-title="pika.btn.new" title="Chơi lại" hidden>🔄</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <main class="screen" id="homeScreen">
      <button class="mode-card" data-mode="classic"><span class="mc-icon">⛏️💰</span><span class="mc-name" data-i18n="daovang.mode.classic">Đào Vàng</span></button>
      <button class="mode-card" data-mode="mice"><span class="mc-icon">🐭💎</span><span class="mc-name" data-i18n="daovang.mode.mice">Cuộc Săn Vàng</span></button>
      <button class="mode-card" data-mode="hard"><span class="mc-icon">🪨⛏️</span><span class="mc-name" data-i18n="daovang.mode.hard">Thợ Mỏ Liều Lĩnh</span></button>
    </main>

    <main class="screen hidden" id="playScreen">
      <div class="hud">
        <div class="hud-chip money"><span>💰</span><b id="hudMoney">0</b>/<span id="hudGoal">0</span></div>
        <div class="hud-chip time"><span>⏳</span><b id="hudTime">0</b></div>
        <div class="hud-chip level" id="hudLevel">1</div>
        <button class="hud-chip dyn" id="btnDynamite" hidden><span>🧨</span><b id="hudDyn">0</b></button>
      </div>
      <div class="board-wrap" id="boardWrap">
        <canvas id="gameCanvas" width="640" height="640"></canvas>
      </div>
    </main>

    <main class="screen hidden" id="shopScreen">
      <div class="shop-head">
        <div class="shop-emoji">🏪</div>
        <div class="shop-title" data-i18n="daovang.shop.title">Cửa hàng</div>
        <div class="shop-bank">💰 <b id="shopBank">0</b></div>
      </div>
      <div class="shop-list" id="shopList"></div>
      <button class="big-btn" id="btnShopNext" data-i18n="daovang.shop.next">MÀN TIẾP ▶</button>
    </main>

    <div class="cheer hidden" id="cheer">
      <div class="cheer-emoji" id="cheerEmoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnCheerGo" data-i18n="hocvui.again">TIẾP TỤC ▶</button>
      <button class="big-btn big-btn--ghost" id="btnHome2" data-i18n="hocvui.pick">CHỌN TRÒ KHÁC</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
