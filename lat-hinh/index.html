<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e8">
  <title>Lật Hình Trí Nhớ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/dien-tu-xua/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="lathinh.title">🃏 Lật Hình Trí Nhớ</h1>
      <div class="moves" id="moves">0</div>
      <button class="round-btn" id="btnNew" data-i18n-title="pika.btn.new" title="Ván mới">🔄</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tabClassic" data-i18n="lathinh.tab.classic">🃏 Hình</button>
      <button class="tab" id="tabLetter" data-i18n="lathinh.tab.letter">🅰️ Chữ–hình</button>
      <button class="tab" id="tabNumber" data-i18n="lathinh.tab.number">🔢 Số–lượng</button>
    </div>

    <main class="stage">
      <div class="grid" id="grid"></div>
    </main>

    <!-- Khen thưởng -->
    <div class="cheer hidden" id="cheer">
      <div class="cheer-stars" id="cheerStars">⭐⭐⭐</div>
      <div class="cheer-emoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
