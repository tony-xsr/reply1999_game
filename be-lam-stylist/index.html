<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Bé Làm Stylist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/game-mini/" data-i18n-title="hocvui.back" title="Chọn trò khác">◀</a>
      <h1 data-i18n="stylist.title">👗 Bé Làm Stylist</h1>
      <button class="round-btn" id="btnRandom" title="Trộn ngẫu nhiên">🎲</button>
      <button class="round-btn" id="btnSave" title="Lưu bộ đồ">📷</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="say-bubble" id="sayBubble">👋 Hello!</div>

    <main class="stage">
      <div class="doll-panel">
        <div id="dollBox"></div>
      </div>
      <div class="wardrobe">
        <div class="slot-tabs" id="slotTabs"></div>
        <div class="item-grid" id="itemGrid"></div>
        <div class="color-row" id="colorRow"></div>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
