<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#eef3ff">
  <title>Ngữ Pháp Trực Quan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/thi-chung-chi-anh/" data-i18n-title="examhub.back" title="Thi Chứng Chỉ Anh">🏠</a>
      <h1 id="title" data-i18n="nguphap.title">🎬 Ngữ Pháp Trực Quan</h1>
      <button class="round-btn" id="btnBack" data-i18n-title="hocvui.back" title="Chọn trò khác" hidden>◀</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi" hidden>❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="sub-line" id="subLine"></div>
    <div class="overall-progress" id="overallProgress"></div>

    <!-- Màn chọn trò -->
    <main class="screen" id="homeScreen">
      <button class="mode-card" data-game="timemachine"><span class="mc-icon">🕰️</span><span class="mc-name" data-i18n="nguphap.timemachine">Cỗ Máy Thời Gian</span></button>
      <button class="mode-card" data-game="twoactions"><span class="mc-icon">⏳</span><span class="mc-name" data-i18n="nguphap.twoactions">Hai Hành Động Cùng Lúc</span></button>
      <button class="mode-card" data-game="comparative"><span class="mc-icon">📈</span><span class="mc-name" data-i18n="nguphap.comparative">So Sánh Hơn/Nhất</span></button>
      <button class="mode-card" data-game="goingtowill"><span class="mc-icon">🔮</span><span class="mc-name" data-i18n="nguphap.goingtowill">Going To vs Will</span></button>
      <button class="mode-card" data-game="modal"><span class="mc-icon">🚦</span><span class="mc-name" data-i18n="nguphap.modal">Modal Ai Đúng</span></button>
      <button class="mode-card" data-game="conditional"><span class="mc-icon">🌦️</span><span class="mc-name" data-i18n="nguphap.conditional">Câu Điều Kiện</span></button>
      <button class="mode-card" data-game="sentencebuilder"><span class="mc-icon">🧩</span><span class="mc-name" data-i18n="nguphap.sentencebuilder">Ghép Câu</span></button>
      <button class="mode-card" data-game="passive"><span class="mc-icon">🔄</span><span class="mc-name" data-i18n="nguphap.passive">Chủ Động vs Bị Động</span></button>
      <button class="mode-card" data-game="reported"><span class="mc-icon">🗣️</span><span class="mc-name" data-i18n="nguphap.reported">Lời Nói Gián Tiếp</span></button>
      <button class="mode-card" data-game="quantifier"><span class="mc-icon">🔢</span><span class="mc-name" data-i18n="nguphap.quantifier">Lượng Từ Đúng</span></button>
      <button class="mode-card" data-game="posgame"><span class="mc-icon">🏷️</span><span class="mc-name" data-i18n="nguphap.posgame">Nhận Biết Từ Loại</span></button>
    </main>

    <!-- Màn chơi chung: từng trò tự dựng nội dung -->
    <main class="screen hidden" id="playScreen"></main>

    <div class="cheer hidden" id="cheer">
      <div class="cheer-emoji" id="cheerEmoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
      <button class="big-btn big-btn--ghost" id="btnHome2" data-i18n="hocvui.pick">CHỌN TRÒ KHÁC</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
