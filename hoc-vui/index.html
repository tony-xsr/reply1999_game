<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Học Vui — Từ Vựng &amp; Con Số</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="hocvui.title">🧩 Học Vui</h1>
      <button class="round-btn" id="btnBack" data-i18n-title="hocvui.back" title="Chọn trò khác" hidden>◀</button>
      <button class="lang-btn" id="btnLang" data-i18n-title="hocvui.lang" title="Đổi ngôn ngữ học">🇻🇳 Tiếng Việt</button>
      <button class="round-btn" id="btnSay" data-i18n-title="tomau.say" title="Đọc lại" hidden>📢</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi" hidden>❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <!-- Chấm tiến độ trong 1 lượt chơi -->
    <div class="dots hidden" id="dots"></div>

    <!-- Màn chọn trò -->
    <main class="screen" id="homeScreen">
      <button class="mode-card" id="modeMatch">
        <span class="mc-icon">🧩</span>
        <span class="mc-name" data-i18n="hocvui.mode.match">Ghép chữ với hình</span>
      </button>
      <button class="mode-card" id="modeCount">
        <span class="mc-icon">🍎</span>
        <span class="mc-name" data-i18n="hocvui.mode.count">Đếm &amp; so sánh</span>
      </button>
      <button class="mode-card" id="modeListen">
        <span class="mc-icon">👂</span>
        <span class="mc-name" data-i18n="hocvui.mode.listen">Nghe &amp; tìm</span>
      </button>
    </main>

    <!-- Ghép chữ với hình -->
    <main class="screen hidden" id="matchScreen">
      <div class="pic-grid" id="picGrid"></div>
      <div class="word-row" id="wordRow"></div>
    </main>

    <!-- Đếm & so sánh -->
    <main class="screen hidden" id="countScreen">
      <div class="question" id="countPrompt"></div>
      <div class="count-field" id="countField"></div>
      <div class="answer-row" id="answerRow"></div>
    </main>

    <!-- Nghe & tìm -->
    <main class="screen hidden" id="listenScreen">
      <button class="hear-btn" id="btnHear">🔊</button>
      <div class="listen-grid" id="listenGrid"></div>
    </main>

    <!-- Khen thưởng cuối lượt -->
    <div class="cheer hidden" id="cheer">
      <div class="cheer-emoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
      <button class="big-btn big-btn--ghost" id="btnHome" data-i18n="hocvui.pick">CHỌN TRÒ KHÁC</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
