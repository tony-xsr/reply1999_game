<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e8">
  <title>Đếm &amp; So Sánh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/goc-tieng-anh/" data-i18n-title="hocvui.back" title="Chọn trò khác">◀</a>
      <h1 data-i18n="demsosanh.title">🍎 Đếm &amp; So Sánh</h1>
      <button class="lang-btn" id="btnLang" data-i18n-title="hocvui.lang" title="Đổi ngôn ngữ học">🇻🇳 Tiếng Việt</button>
      <button class="round-btn" id="btnSay" data-i18n-title="tomau.say" title="Đọc lại">📢</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="dots" id="dots"></div>

    <main class="screen" id="countScreen">
      <div class="question" id="countPrompt"></div>
      <div class="count-field" id="countField"></div>
      <div class="answer-row" id="answerRow"></div>
    </main>

    <div class="cheer hidden" id="cheer">
      <div class="cheer-emoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
