<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e8">
  <title>Luyện Tư Duy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 id="title" data-i18n="tuduy.title">🧠 Luyện Tư Duy</h1>
      <button class="round-btn" id="btnBack" data-i18n-title="hocvui.back" title="Chọn trò khác" hidden>◀</button>
      <button class="round-btn" id="btnNew" data-i18n-title="pika.btn.new" title="Bài mới" hidden>🔄</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi" hidden>❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="sub-line" id="subLine"></div>

    <!-- Màn chọn trò -->
    <main class="screen" id="homeScreen">
      <button class="mode-card" data-game="maze"><span class="mc-icon">🌀</span><span class="mc-name" data-i18n="tuduy.maze">Mê cung</span></button>
      <button class="mode-card" data-game="sudoku"><span class="mc-icon">🔢</span><span class="mc-name" data-i18n="tuduy.sudoku">Sudoku bé</span></button>
      <button class="mode-card" data-game="spot"><span class="mc-icon">🔍</span><span class="mc-name" data-i18n="tuduy.spot">Tìm điểm khác</span></button>
      <button class="mode-card" data-game="dots"><span class="mc-icon">✏️</span><span class="mc-name" data-i18n="tuduy.dots">Nối số thành hình</span></button>
      <button class="mode-card" data-game="odd"><span class="mc-icon">🎯</span><span class="mc-name" data-i18n="tuduy.odd">Cái nào khác nhóm?</span></button>
      <button class="mode-card" data-game="hanoi"><span class="mc-icon">🥞</span><span class="mc-name" data-i18n="tuduy.hanoi">Xếp bánh cho gấu</span></button>
    </main>

    <!-- Màn chơi chung: từng trò tự dựng nội dung -->
    <main class="screen hidden" id="playScreen"></main>

    <div class="cheer hidden" id="cheer">
      <div class="cheer-emoji" id="cheerEmoji">🏆</div>
      <div class="cheer-text" id="cheerText"></div>
      <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
      <button class="big-btn big-btn--ghost" id="btnHome2" data-i18n="hocvui.pick">CHỌN TRÒ KHÁC</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
