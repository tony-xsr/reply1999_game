<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff6e8">
  <title>Toán Lớp 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="round-btn" href="/hoc-va-choi/" data-i18n-title="pika.btn.home" title="TRANG CHỦ">🏠</a>
      <h1 data-i18n="toan.title">➕ Toán Lớp 1</h1>
      <button class="round-btn" id="btnSay" data-i18n-title="tomau.say" title="Đọc lại">📢</button>
      <button class="round-btn" id="btnHelp" data-i18n-title="pika.btn.help" title="Cách chơi">❓</button>
      <button class="round-btn" id="btnSound" data-i18n-title="pika.btn.sound" title="Âm thanh">🔊</button>
    </header>

    <div class="tabs-row">
      <button class="tab active" id="tabAdd">➕ <span data-i18n="toan.tab.add">Cộng trừ</span></button>
      <button class="tab" id="tabCompare">⚖️ <span data-i18n="toan.tab.compare">So sánh</span></button>
      <button class="tab" id="tabClock">🕐 <span data-i18n="toan.tab.clock">Xem giờ</span></button>
      <button class="tab" id="tabShape">🔺 <span data-i18n="toan.tab.shape">Hình &amp; quy luật</span></button>
      <button class="tab" id="tabShop">💰 <span data-i18n="toan.tab.shop">Đi chợ</span></button>
    </div>

    <div class="dots" id="dots"></div>

    <main class="stage">
      <div class="question" id="question"></div>
      <div class="field" id="field"></div>
      <div class="tray" id="tray"></div>

      <div class="cheer hidden" id="cheer">
        <div class="cheer-emoji">🏆</div>
        <div class="cheer-text" id="cheerText"></div>
        <button class="big-btn" id="btnAgain" data-i18n="hocvui.again">CHƠI TIẾP ▶</button>
      </div>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
